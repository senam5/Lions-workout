<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lions — Log Session</title>
<link rel="stylesheet" href="lions.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 24px; max-width: 420px; width: 100%; text-align: center; }
  .lion { font-size: 50px; margin-bottom: 14px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; line-height: 1; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--grey); margin-bottom: 22px; }
  .detail-box { background: var(--lion-glow); border: 1px solid var(--lion); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 22px; }
  .detail-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .detail-loc { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--grey); letter-spacing: 0.5px; }
  .note { font-size: 12px; color: var(--grey2); margin-top: 16px; line-height: 1.6; }
  .err { background: rgba(204,34,41,0.12); border: 1px solid var(--lion); color: var(--white); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="panel">
  <div class="lion">🦁</div>
  <h1>LOG YOUR SESSION</h1>
  <p class="sub">Review your details and tap to submit</p>

  <div class="err" id="error-box">Could not load session details. Please go back to the app.</div>

  <div class="detail-box" id="detail-box">
    <div class="detail-name" id="player-name">Loading...</div>
    <div class="detail-loc" id="player-loc"></div>
  </div>

  <a id="submit-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary" style="margin-bottom:10px">📋 SUBMIT TO GOOGLE FORMS</a>
  <button class="btn-secondary" style="width:100%" onclick="window.history.back()">← GO BACK</button>

  <p class="note">Tapping Submit opens Google Forms with your info pre-filled.<br>Just hit <strong>Submit</strong> on that page and you're done.</p>
</div>

<script src="lions.js"></script>
<script>
'use strict';
var FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeZjGjDxRXBdrQ2NY9FL5iWfyITCYX_DoWY_adDspy-sL7Okw/formResponse';

function getParams() {
  var q = new URLSearchParams(window.location.search);
  return {
    name: q.get('name'), group: q.get('group'), phase: q.get('phase'),
    week: q.get('week'), day: q.get('day')
  };
}

function buildFormURL(p) {
  var params = new URLSearchParams({
    'entry.2115284305': p.name,
    'entry.1660752183': p.group,
    'entry.1461489066': p.phase || '-',
    'entry.1984450758': p.week,
    'entry.372827159': p.day === 'upper' ? 'Upper body' : 'Lower body',
    'entry.980302362': new Date().toISOString().split('T')[0],
    'entry.390357744': new Date().toLocaleString('en-CA')
  });
  return FORM_URL + '?' + params.toString();
}

function locStr(p) {
  var g = p.group === 'A' ? 'Group A · Phase ' + p.phase : p.group === 'B' ? 'Group B' : 'Group C';
  return g + ' · Week ' + p.week + ' · ' + (p.day === 'upper' ? 'Upper body' : 'Lower body');
}

var p = getParams();
if (!p.name) {
  document.getElementById('error-box').style.display = 'block';
  document.getElementById('detail-box').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'none';
} else {
  document.getElementById('player-name').textContent = p.name;
  document.getElementById('player-loc').textContent = locStr(p);
  document.getElementById('submit-btn').href = buildFormURL(p);
}
</script>
</body>
</html>
