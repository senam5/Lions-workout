<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
  :root { --ink: #1a1a1a; --line: #ddd; --muted: #666; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px; max-width: 700px; margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink); background: #fff;
  }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
  .header h1 { font-size: 22px; margin: 0; }
  .header .muted { color: var(--muted); font-size: 13px; }
  .meta { text-align: right; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .total-row td { border-bottom: none; font-weight: 700; font-size: 16px; padding-top: 16px; }
  .print-btn { margin: 24px 0; padding: 10px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  @media print { .print-btn { display: none; } body { padding: 0; } }
  #error { color: #b00; }
</style>
</head>
<body>
  <div id="content">Loading…</div>

<script>
  const SUPABASE_URL = 'https://xcpxyscqzdbqqsfsbtqs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjcHh5c2NxemRicXFzZnNidHFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDczOTAsImV4cCI6MjEwMjk4MzM5MH0.JYJgB4cXg7WMXtMx5-q_CmJCuR8MMZMA9fWTpALMB1k';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmtMoney(n) { return '$' + Number(n).toFixed(2); }

  async function render() {
    const id = new URLSearchParams(window.location.search).get('id');
    const content = document.getElementById('content');

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      content.innerHTML = '<p id="error">Sign in first, then open this invoice from the Receivables page.</p>';
      return;
    }

    const { data: r, error } = await sb.from('receivables').select('*').eq('id', id).single();
    if (error || !r) {
      content.innerHTML = '<p id="error">Could not load this receivable.</p>';
      return;
    }

    const invoiceNumber = 'LNS-' + r.id.slice(0, 8).toUpperCase();
    const issueDate = new Date(r.created_at).toLocaleDateString('en-CA', { month: 'long', day: 'numeric', year: 'numeric' });

    content.innerHTML =
      '<div class="header">' +
        '<div><h1>Lions Basketball Program</h1><div class="muted">Invoice</div></div>' +
        '<div class="meta">Invoice #' + invoiceNumber + '<br>Issued ' + issueDate +
          (r.due_date ? '<br>Due ' + new Date(r.due_date + 'T00:00:00').toLocaleDateString('en-CA', { month: 'long', day: 'numeric', year: 'numeric' }) : '') +
        '</div>' +
      '</div>' +
      '<p><strong>Bill to:</strong><br>' + escapeHtml(r.owed_by) + (r.owed_by_email ? '<br>' + escapeHtml(r.owed_by_email) : '') + '</p>' +
      '<table>' +
        '<tr><th>Description</th><th>Category</th><th style="text-align:right;">Amount</th></tr>' +
        '<tr><td>' + escapeHtml(r.description || '—') + '</td><td>' + escapeHtml(r.category) + '</td><td style="text-align:right;">' + fmtMoney(r.amount) + '</td></tr>' +
        '<tr class="total-row"><td colspan="2">Total due</td><td style="text-align:right;">' + fmtMoney(r.amount) + '</td></tr>' +
      '</table>' +
      '<button class="print-btn" onclick="window.print()">Print / Save as PDF</button>';
  }

  render();
</script>
</body>
</html>
