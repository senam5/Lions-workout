<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense History</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
  <nav>
    <a href="add.html">Add</a>
    <a href="history.html" class="active">History</a>
    <a href="invoices.html">Invoices</a>
  </nav>
  <h1>Expense history</h1>

  <div class="card">
    <p class="muted" style="margin:0 0 8px;">TOTAL SPENT</p>
    <p id="total" style="font-size:28px;margin:0;">–</p>
  </div>

  <div class="card">
    <p class="muted" style="margin:0 0 8px;">EXPENSES</p>
    <div id="list"></div>
  </div>

<script src="js/supabaseClient.js"></script>
<script>
  function fmtDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtMoney(n) { return '$' + Number(n).toFixed(2); }

  async function load() {
    const session = await requireSession();
    if (!session) return;

    const { data: expenses, error } = await sb.from('expenses').select('*').order('spent_on', { ascending: false });
    const list = document.getElementById('list');

    if (error) {
      list.innerHTML = '<p class="muted">Could not load: ' + error.message + '</p>';
      return;
    }

    if (!expenses || !expenses.length) {
      list.innerHTML = '<p class="muted">No expenses logged yet.</p>';
      document.getElementById('total').textContent = fmtMoney(0);
      return;
    }

    const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
    document.getElementById('total').textContent = fmtMoney(total);

    list.innerHTML = '';
    for (const e of expenses) {
      const row = document.createElement('div');
      row.style.cssText = 'padding:10px 0;border-bottom:1px solid var(--line);';

      const topLine = document.createElement('div');
      topLine.style.cssText = 'display:flex;justify-content:space-between;font-size:14px;';
      topLine.innerHTML =
        '<span>' + fmtDate(e.spent_on) + ' · ' + escapeHtml(e.vendor || '(no vendor)') + ' <span class="muted">(' + escapeHtml(e.category) + ')</span></span>' +
        '<span>' + fmtMoney(e.amount) + '</span>';
      row.appendChild(topLine);

      const actions = document.createElement('div');
      actions.style.cssText = 'margin-top:6px;';

      if (e.receipt_path) {
        const viewBtn = document.createElement('button');
        viewBtn.className = 'secondary';
        viewBtn.style.cssText = 'width:auto;padding:6px 10px;font-size:12px;margin-right:8px;';
        viewBtn.textContent = '📎 View receipt';
        viewBtn.addEventListener('click', async () => {
          const { data, error: urlError } = await sb.storage.from('receipts').createSignedUrl(e.receipt_path, 60);
          if (!urlError) window.open(data.signedUrl, '_blank');
        });
        actions.appendChild(viewBtn);
      }

      const attachBtn = document.createElement('button');
      attachBtn.className = 'secondary';
      attachBtn.style.cssText = 'width:auto;padding:6px 10px;font-size:12px;';
      attachBtn.textContent = e.receipt_path ? 'Replace receipt' : '+ Attach receipt';
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*,.pdf';
      fileInput.style.display = 'none';

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        const { data: { session } } = await sb.auth.getSession();
        const path = session.user.id + '/' + Date.now() + '-' + file.name;

        attachBtn.textContent = 'Uploading…';
        const { error: uploadError } = await sb.storage.from('receipts').upload(path, file);
        if (uploadError) {
          alert('Could not upload: ' + uploadError.message);
          attachBtn.textContent = e.receipt_path ? 'Replace receipt' : '+ Attach receipt';
          return;
        }

        const { error: updateError } = await sb.from('expenses').update({ receipt_path: path }).eq('id', e.id);
        if (updateError) {
          alert('Uploaded but could not link it: ' + updateError.message);
          return;
        }
        load();
      });

      attachBtn.addEventListener('click', () => fileInput.click());
      actions.appendChild(attachBtn);
      actions.appendChild(fileInput);
      row.appendChild(actions);

      list.appendChild(row);
    }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  load();
</script>
</body>
</html>
